name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Stable semantic version without the v prefix
        required: true
        type: string

concurrency:
  group: odp-go-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual releases must run from main." >&2
              exit 1
            fi
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version must be a stable semantic version such as 0.2.0." >&2
              exit 1
            fi
            tag="v$INPUT_VERSION"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists." >&2
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out ODP specifications
        uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-specs
          path: .conformance/odp-specs

      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x

      - name: Verify release
        run: make spec-sync verify consumer-smoke conformance
        env:
          ODP_GO_VERSION: ${{ steps.release.outputs.tag }}
          ODP_SPECS_DIR: .conformance/odp-specs

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "ODP Go $TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Publish GitHub release
        run: >-
          gh release create "${{ steps.release.outputs.tag }}"
          .conformance/reports/agent.json#odp-go-agent-conformance.json
          .conformance/reports/service.json#odp-go-service-conformance.json
          --generate-notes
          --title "ODP Go ${{ steps.release.outputs.tag }}"
          --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
