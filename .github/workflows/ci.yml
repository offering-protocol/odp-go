name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.25.x
          - 1.26.x
    steps:
      - uses: actions/checkout@v7

      - name: Check out ODP specifications
        uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-specs
          path: .conformance/odp-specs

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - run: make spec-sync verify
        env:
          ODP_SPECS_DIR: .conformance/odp-specs

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: odp-go-coverage-go-${{ matrix.go }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 7
