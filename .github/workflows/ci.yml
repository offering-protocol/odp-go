name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go:
          - 1.25.x
          - 1.26.x
    steps:
      - uses: actions/checkout@v7

      - name: Check out ODP specifications
        uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-specs
          path: .conformance/odp-specs

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - run: make spec-sync verify
        env:
          ODP_SPECS_DIR: .conformance/odp-specs

      - name: Verify clean module consumption
        run: make consumer-smoke

      - name: Run shared conformance harness
        run: make conformance
        env:
          ODP_SPECS_DIR: .conformance/odp-specs

      - name: Upload conformance reports
        if: matrix.go == '1.25.x'
        uses: actions/upload-artifact@v7
        with:
          name: odp-go-conformance
          path: .conformance/reports/*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: odp-go-coverage-go-${{ matrix.go }}
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

  node-interoperability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out ODP Node.js
        uses: actions/checkout@v7
        with:
          repository: offering-protocol/odp-node
          path: .interop/odp-node

      - uses: actions/setup-go@v7
        with:
          go-version: 1.25.x

      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3

      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: .interop/odp-node/pnpm-lock.yaml
          node-version: 24

      - name: Install ODP Node.js dependencies
        run: pnpm --dir .interop/odp-node install --frozen-lockfile

      - name: Run Node.js Service interoperability
        run: make interoperability
        env:
          ODP_NODE_DIR: .interop/odp-node
